version: '3.8'

services:
  semantic-detector:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - OLLAMA_ENDPOINT=http://ollama:11434
      - DEBUG=false
    command: python -m semantic_detector.web.app.main
    depends_on:
      - ollama
  
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pull default embedding model on startup
    command: >
      sh -c "ollama serve & 
      sleep 15 && 
      until curl -s http://localhost:11434/api/tags > /dev/null; do sleep 2; done && 
      echo '[INFO] Ollama is ready, downloading nomic-embed-text...' && 
      ollama pull nomic-embed-text && 
      echo '[INFO] Model download complete. Available models:' && 
      ollama list && 
      wait"

volumes:
  ollama_data:

