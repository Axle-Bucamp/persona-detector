[project]
name = "semantic-detector"
version = "0.1.0"
description = "Language fingerprinting and embedding analysis system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "umap-learn>=0.5.4",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "nltk>=3.8.0",
    "scipy>=1.11.1",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.0.0",
    "jsonpath-ng>=1.6.0",
    "pymupdf>=1.23.0",
    "python-dateutil>=2.8.0",
    "reportlab>=4.0.0",
    "scikit-learn>=1.3.0",
    "selenium>=4.36.0",
    "seaborn>=0.13.2",
    "kaleido>=1.2.0",
    "umap>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
semantic-detector = "semantic_detector.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semantic_detector"]

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
target-version = "py38"

